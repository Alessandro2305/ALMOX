<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="interface.css">
    <title>Consulta de Saldo</title>
</head>

<body>

    <main class="container">
        <header class="header">
            <div class="foto">
                <img id="fotoProduto" src="" alt="">
            </div>
            <h2>Filtro de Combustível</h2>
            <span class="codigo">Código: 5801</span>
        </header>

        <section class="saldo-card">
            <span class="saldo-label">SALDO ATUAL</span>
            <strong class="saldo-valor">25 <span>UN</span></strong>
        </section>

        <section class="grid-info">
            <div class="card">
                <span class="label">Marca</span>
                <strong class="valor">UN</strong>
            </div>

            <div class="card">
                <span class="label">Endereço</span>
                <strong class="valor">E14-R2-010</strong>
            </div>

            <div class="card">
                <span class="label">Valor Unitário</span>
                <strong class="valor">R$ 279,82</strong>
            </div>

            <div class="card">
                <span class="label">Valor de Estoque</span>
                <strong class="valor">R$ 3.750,37</strong>
            </div>

            <div class="card">
                <span class="label">Última Entrada</span>
                <strong class="valor">11/09/2026</strong>
            </div>

            <div class="card">
                <span class="label">Última Saída</span>
                <strong class="valor">20/09/2026</strong>
            </div>
        </section>

        <footer class="btn-group">
            <button type="button" class="btn btn-primary">NOVA CONSULTA</button>
            <button type="button" class="btn btn-secondary">VOLTAR</button>
        </footer>
    </main>
    <script src="script.js"></script>

</body>

</html>
